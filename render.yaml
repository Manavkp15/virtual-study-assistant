databases:
  - name: virtual-study-db
    databaseName: vsa_db
    user: vsa_user
    plan: free

services:
  - type: web
    name: virtual-study-assistant
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-study-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
